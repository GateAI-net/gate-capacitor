buildscript {
    ext.kotlin_version = rootProject.ext.has('kotlinVersion') ? rootProject.ext.kotlinVersion : '2.0.20'
    repositories { google(); mavenCentral() }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "org.jetbrains.kotlin:kotlin-serialization:$kotlin_version"
    }
}
apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'
apply from: 'gate-core-version.gradle'

android {
    namespace 'com.gateai.sdk'
    compileSdk (rootProject.ext.has('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 35)
    defaultConfig {
        minSdk 24
        buildConfigField 'String', 'SDK_VERSION', '"' + gateAICoreVersion + '"'
        consumerProguardFiles 'consumer-rules.pro'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    sourceSets.main.java.srcDirs += ['src/main/kotlin', '../native/android']
}
repositories { google(); mavenCentral() }
dependencies {
    implementation project(':capacitor-android')
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.1'
    implementation 'io.ktor:ktor-client-core:2.3.11'
    implementation 'io.ktor:ktor-client-okhttp:2.3.11'
    implementation 'io.ktor:ktor-client-content-negotiation:2.3.11'
    implementation 'io.ktor:ktor-serialization-kotlinx-json:2.3.11'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.android.play:integrity:1.4.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
}
